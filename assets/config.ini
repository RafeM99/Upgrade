; Upgrade (console-eras rage platformer): every tuning number in the game.
; Restart the game to see a change.

[window]
width = 1280
height = 720

[player]
walk_speed = 6.0
run_speed = 9.5
accel = 45.0
jump_speed = 15.0
gravity = 36.0
max_fall_speed = 22.0
jump_release_gravity = 2.0
coyote_time = 0.1
jump_buffer = 0.1
stomp_bounce = 10.0
stomp_bounce_high = 15.0
death_seconds = 1.2
respawn_invuln = 1.5
; Seconds a player can stay off-screen before being pulled back to their partner.
offscreen_pull_seconds = 1.5

[camera]
view_height = 14
look_ahead = 3.0
follow_speed = 6.0

[world]
; Random chunks in each world before the flagpole. Worlds 1-5 are the NES, SNES, N64,
; GameCube and Wii eras. After that the worlds are endless, one chunk longer each time.
chunks_per_world = 5
max_chunks_per_world = 10

[era]
transition_seconds = 2.5

[spawner]
ahead_tiles = 60
behind_tiles = 40

[traps]
; Seconds a fake floor holds after you step on it.
fake_floor_delay = 0.12

[enemies]
walker_speed = 2.0
brute_speed = 1.2
brute_hp = 2
mimic_speed = 3.5
mimic_wake_distance = 2.5
flyer_amplitude = 1.5
flyer_drift = 0.8
; The flagpole runs when you get this close (SNES era on).
flag_run_distance = 4.5
