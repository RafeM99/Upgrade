; Upgrade: every tuning number in one place. Change, save, restart the game.
; Units: tiles and seconds. One tile = one block.

[player]
run_speed = 7.5
accel_ground = 70
accel_air = 45
gravity = 52
jump_speed = 19        ; about 3.4 tiles high
jump_cut_speed = 7     ; let go of jump early for a short hop
max_fall = 22
coyote_time = 0.1
jump_buffer = 0.12
stomp_bounce = 13
attack_from_era = 1    ; Camilla's rule: stomp kills from the start; the attack button unlocks at the first upgrade
attack_time = 0.18
attack_cooldown = 0.35

[abilities]
double_jump_speed = 16.5
dash_speed = 21
dash_time = 0.2
dash_cooldown = 0.55
pound_speed = 28
glide_fall_speed = 2.6
wall_slide_speed = 4
wall_jump_push = 9
wall_jump_speed = 17.5
time_slow_duration = 3
time_slow_cooldown = 10
time_slow_factor = 0.3  ; enemies and the wall move at 30% speed

[coop]
revive_seconds = 0.6     ; how long to touch a Faded partner
faded_speed_mult = 0.5
offscreen_seconds = 2    ; left behind this long: pulled to your partner (and Faded)
invuln_after_revive = 2

[memory]
; Camilla's rule: the bar fills to 100 in every era, then empties for the next one.
fragment_value = 2
fragment_magnet_radius = 2.8
passive_per_tile = 0.03  ; a little fill just from moving forward
lost_penalty = 10        ; both Faded: the bar drops this much (never below 0)

[boss]
enabled = 1              ; the Forgetting appears when the bar is full; beat it to upgrade
base_hits = 3            ; hits needed = base_hits + era

[wall]
base_speed = 1.6
speed_per_era = 0.45
catchup_distance = 24    ; rubber band: further ahead than this and the wall speeds up
catchup_strength = 0.25
start_delay = 4
respawn_gap = 14

[enemies]
blob_speed = 1.7
flyer_drift_speed = 1.3
brute_speed = 1.2
brute_charge_speed = 6.5
brute_hp = 3
speed_per_era = 0.15
blob_fragments = 1
flyer_fragments = 2
brute_fragments = 5
extra_spawn_seconds = 9  ; a Glitch Flyer drifts in this often (faster in later eras)

[powerups]
drop_percent = 6         ; chance an enemy drops a power-up
weight_0 = 3             ; Keepsake locket (shield)
weight_1 = 2             ; Hourglass (pushes the wall back)
weight_2 = 2             ; Lullaby (fragment magnet)
weight_3 = 2             ; Old photograph (+bar)
weight_4 = 2             ; Old trainers (speed)
hourglass_push = 8
hourglass_seconds = 6
hourglass_slow_factor = 0.3
magnet_seconds = 10
photo_value = 8
speed_seconds = 8
speed_mult = 1.4

[level]
generated_chunk_chance = 0.3   ; share of chunks made by the generator instead of the files

[audio]
music_volume = 0.55
sfx_volume = 0.8

[ending]
slide_seconds = 5

[input]
; Key names: A-Z, 0-9, SPACE, ENTER, LEFT, RIGHT, UP, DOWN, LEFT_SHIFT, RIGHT_SHIFT,
; LEFT_CONTROL, RIGHT_CONTROL, SLASH, PERIOD, COMMA, KP_0.. Separate alternatives with commas.
p1_left = A
p1_right = D
p1_up = W
p1_down = S
p1_jump = SPACE
p1_attack = F
p1_ability = G
p2_left = LEFT
p2_right = RIGHT
p2_up = UP
p2_down = DOWN
p2_jump = RIGHT_CONTROL,ENTER
p2_attack = RIGHT_SHIFT
p2_ability = SLASH
pause = ESCAPE,P
